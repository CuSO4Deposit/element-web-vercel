name: update-element

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/element-hq/element-web/releases/latest \
            | jq -r '.tag_name')"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Bump version file
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          current="$(cat element-version.txt)"
          if [ "$VERSION" = "$current" ]; then
            echo "Already on $current"
            exit 0
          fi
          printf '%s\n' "$VERSION" > element-version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add element-version.txt
          git commit -m "Bump Element Web to $VERSION"
          git push
